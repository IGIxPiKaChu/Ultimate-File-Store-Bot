name: Repair uploaded project paths
# Re-triggered to restore the flattened upload into its original layout.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore project directory structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          prefix = "ultimate-file-store-bot_"
          mappings = (
              (".github_workflows_", ".github/workflows/"),
              (".github_", ".github/"),
              ("assets_", "assets/"),
              ("core_", "core/"),
              ("database_", "database/"),
              ("plugins_", "plugins/"),
              ("tests_", "tests/"),
          )

          for source in list(Path(".").iterdir()):
              if not source.is_file() or not source.name.startswith(prefix):
                  continue
              suffix = source.name[len(prefix):]
              target_name = suffix
              for marker, destination in mappings:
                  if suffix.startswith(marker):
                      target_name = destination + suffix[len(marker):]
                      break
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  raise SystemExit(f"Refusing to overwrite existing file: {target}")
              os.replace(source, target)
              print(f"{source} -> {target}")

          required = ["main.py", "config.py", "requirements.txt", "bot.py", "core", "plugins", "database"]
          missing = [name for name in required if not Path(name).exists()]
          if missing:
              raise SystemExit("Required project paths still missing: " + ", ".join(missing))
          PY
      - name: Commit repaired paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore project directory structure"
            git push
          else
            echo "No path repairs needed."
          fi
